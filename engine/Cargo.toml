[package]
name = "engine"
version = "0.1.0"
edition = "2021"

[dependencies]
zmq = "0.10"
redis = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1.3"
crossbeam-channel = "0.5"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ctrlc = { version = "3", features = ["termination"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
